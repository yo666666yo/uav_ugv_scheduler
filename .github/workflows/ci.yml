name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest tests/test_llm_planner.py tests/test_openai_request.py
      - run: python -m pytest tests -q
        working-directory: master_agent
      - run: python -m compileall -q llm_planner.py master_agent/master_agent tests

  task-plan-cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DBUILD_ZRDDS_DEMO=OFF -DBUILD_TESTING=ON
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure
